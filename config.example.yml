# Homelab dashboard config — this file is the source of truth.
# Copy to config.yml (next to where the dashboard runs) and edit freely:
# a browser refresh is enough, no rebuild or restart needed.
#
# Self-explanatory shapes — every block's start line says what it is:
#
#   - group: <name>        starts a group (parent: holds groups + children)
#       groups: [ list of groups ]      ← nested parents, indented under it
#       children: [ list of children ]  ← the leafs it contains
#
#     a CHILD's start line names its kind:
#       - service: <name>   a link        → needs url:
#       - app: <name>       a local exe   → needs run: (confirm + host-only)
#     (the plain `title:`/`items:` keys still work as aliases)

title: Homelab

# the style selected on first visit — a resources/styles folder name;
# a viewer's own pick is remembered in the browser. If the name is not
# found the first folder is used.
defaultStyle: modern

# simple switch: true = editing (config + styles) allowed from wherever the
# dashboard is browsed. An explicit editAccess (local|lan|any) wins over it.
editable: true

groups:
  - group: Favourites        # ← a group starts here
    subtitle: quick access
    children:
      - service: Proxmox VE  # ← a service (link) child
        subtitle: hypervisor
        url: https://192.168.1.5:8006
        icon: https://raw.githubusercontent.com/…/proxmox-icon.svg
        tags: [infra, virt]

      - service: Pi-hole
        url: http://192.168.1.10/admin
        tags: [network, dns]
        health:
          path: /
          interval: 30s

  - group: Servers           # a group holding other groups…
    groups:
      - group: Server 1      # …nested parents, reached by drilling in
        subtitle: 192.168.1.30
        children:
          - service: Gitea
            url: http://192.168.1.30:3000
            tags: [dev]
            health:
              path: /
              interval: 60s
              degraded_after: 250ms   # answers slower than this show DEGRADED

      - group: Server 2
        subtitle: 192.168.1.31
        children:
          - service: Jellyfin
            url: http://192.168.1.31:8096
            tags: [media]
            health:
              path: /health
              interval: 30s

  - group: Desktop (local)   # app children: launched on the dashboard's own
    children:                # machine after a confirm — only there, never
      - app: Steam           # in the container
        run: C:\Program Files (x86)\Steam\steam.exe
        icon: steam.png      # any file in <data-dir>/resources/icons/
        tags: [games, local]

      - app: Notepad
        run: notepad.exe
        tags: [local]